version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: 'every 2 weeks on monday at 06:00'
      timezone: Europe/Brussels
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: cron
      cronjob: 'every 2 weeks on monday at 06:30'
      timezone: Europe/Brussels
    open-pull-requests-limit: 10
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: 'every 2 weeks on monday at 07:00'
      timezone: Europe/Brussels
    open-pull-requests-limit: 5
    # Numeric dtolnay/rust-toolchain refs are published before the matching
    # Rust release reaches stable, so Dependabot mistakes beta toolchains for
    # normal version upgrades. Keep this in sync with rust-toolchain.toml when
    # intentionally upgrading Rust instead.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      workflow-actions:
        patterns: ['*']
