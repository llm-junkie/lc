name: Desktop release

# A version tag starts validation of that exact commit, then packages the
# unsigned applications and uploads them to a draft release. Publication is
# manual. workflow_dispatch supports retrying an existing tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify tag and manifest versions
        run: node scripts/check-release-version.mjs "${GITHUB_REF_NAME}"

  validation:
    name: Validate release commit
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.name }}
    needs: validation
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            # Build on Tauri v2's oldest practical Ubuntu baseline so the
            # resulting glibc requirement stays compatible with Ubuntu 22.04.
            # No portable zip on Linux — the AppImage is the portable format
            # (the raw binary needs system WebKitGTK and isn't self-contained).
            platform: ubuntu-22.04
            args: --bundles deb,appimage,rpm
            rust-targets: ''
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis,msi
            rust-targets: ''
            portable-platform: windows
            portable-arch: x64
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            rust-triple: aarch64-apple-darwin
            # Match tauri-action's asset naming: darwin_aarch64
            portable-platform: darwin
            portable-arch: aarch64
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            rust-triple: x86_64-apple-darwin
            # Match tauri-action's asset naming: darwin_x64
            portable-platform: darwin
            portable-arch: x64

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Cargo downloads
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare production frontend and legal artifacts
        run: npm run release:prepare

      - name: Build installers and update the draft release
        id: tauri
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LC ${{ github.ref_name }}
          releaseBody: Automated draft. Validate every installer and portable archive before publication. Binaries are unsigned and un-notarized; first-launch security warnings are expected.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          retryAttempts: 2
          releaseAssetNamePattern: lc_[version]_[platform]_[arch][setup][ext]
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }} -- --locked
      - name: Resolve app version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # tauri-action always packages the macOS .app into a .app.tar.gz and
      # uploads it (there is no option to disable this). We ship the .dmg plus
      # our own -portable.zip instead, so remove the redundant .app.tar.gz.
      - name: Remove tauri-action .app.tar.gz asset
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset "${{ github.ref_name }}" "lc_${{ steps.version.outputs.version }}_darwin_${{ matrix.portable-arch }}.app.tar.gz" --yes || true

      # Portable archives attached to the same draft release:
      #   Windows -> zip of the binary and its resources/notices
      #   macOS   -> zip of the .app bundle (the portable unit on macOS)
      #   Linux   -> no zip; the AppImage is the portable format
      - name: Create portable archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Create portable archive (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/portable"
          cd "src-tauri/target/${{ matrix.rust-triple }}/release/bundle/macos"
          zip -r "$GITHUB_WORKSPACE/portable/lc_${{ steps.version.outputs.version }}_${{ matrix.portable-platform }}_${{ matrix.portable-arch }}-portable.zip" "LLM Client.app"

      - name: Attach portable archives to release
        # Linux produces no portable zip (the AppImage covers it), so the glob
        # would match nothing there.
        if: runner.os != 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" portable/lc_*-portable.zip --clobber
      - name: Verify staged legal resources
        run: node scripts/check-release-licenses.mjs --artifacts

      - name: Normalize artifact paths for provenance
        id: artifacts
        if: github.event.repository.private == false
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          node -e "const fs=require('node:fs');const paths=JSON.parse(process.env.ARTIFACT_PATHS);if(!Array.isArray(paths)||paths.length===0)throw new Error('Tauri returned no artifacts');fs.appendFileSync(process.env.GITHUB_OUTPUT,'paths<<EOF\n'+paths.join('\n')+'\nEOF\n')"

      - name: Attest build provenance
        if: github.event.repository.private == false
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ steps.artifacts.outputs.paths }}
