name: CI

# Manual only. The automatic triggers below stay commented out on purpose —
# run this workflow from the Actions tab.
on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  licensing:
    name: Release license policy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Install dependencies
        run: npm ci

      - name: Verify releasable dependency licenses
        run: npm run licenses:check

  # Source gates and the production build. All of these are platform-neutral,
  # so they run once on Linux; the cross-platform work is in frontend-tests.
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check documentation sync
        run: npm run check:docs-sync

      - name: Check relative import extensions
        run: npm run check:imports

      - name: Check test registry
        run: npm run check:tests

      - name: Lint
        run: npm run lint

      - name: Build frontend and common resources
        run: npm run build

  # The suite drives path handling, file locking, and archive round-trips, so
  # it runs on every platform LC ships to rather than on Linux alone.
  frontend-tests:
    name: Frontend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - name: Cache Cargo downloads
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}

      - name: Stage Tauri resources
        run: node ../scripts/copy-tauri-resources.mjs --dev

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
